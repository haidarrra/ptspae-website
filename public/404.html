<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Mengalihkan...</title>
    <script>
      // GitHub Pages SPA fallback for a Project Page:
      // https://haidarrra.github.io/ptspae-website/
      // Keep the first path segment (the repo name) and encode the rest.
      (function (l) {
        var pathSegmentsToKeep = 1
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname.slice(1 + pathSegmentsToKeep).split('/').join('/') +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash
        )
      })(window.location)
    </script>
  </head>
  <body>
    <p>Mengalihkan...</p>
  </body>
</html>
